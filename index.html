<!-- Excel kutubxonasi kerak bo‘lganda yuklanadi -->
<style>
:root{--bg:#f4f5f7;--cd:#fff;--tx:#1b1f27;--mu:#6b7280;--ac:#7c4dff;--bd:#e3e6ea;--dg:#d33;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--cd:#1e2128;--tx:#eceef2;--mu:#9aa1ad;--ac:#a78bff;--bd:#2c313a;--dg:#ff6b6b;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);margin-top:4px}
textarea{min-height:70px}label{display:block;font-size:13px;color:var(--mu);margin-top:10px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}.btn.d{background:var(--dg)}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}.hide{display:none!important}.sm{font-size:13px;color:var(--mu)}
#lk{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#2a1a5e,#0b0816 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px;z-index:20}
#lk h2{margin:0;font-weight:600;letter-spacing:.5px}#lk .sm{color:#b9a9e8}
.orb{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#6a3df0,#e0409a);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 50px #7c4dff66;touch-action:manipulation;user-select:none}
.orb svg{width:90px;height:90px}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #b08cff;opacity:0}
.orb.on::before{animation:p 1.6s infinite}.orb.on::after{animation:p 1.6s .8s infinite}
@keyframes p{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.7);opacity:0}}
#pwbox{width:100%;max-width:300px}#pwbox input{background:#ffffff14;border-color:#ffffff30;color:#fff;text-align:center}
.err{color:#ff8a8a;font-size:14px;min-height:18px}
#app{max-width:720px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top h1{font-size:20px;margin:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.chip{white-space:nowrap;padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--cd);font-size:14px;cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bn{background:var(--cd);border:1px solid var(--ac);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px;cursor:pointer}
.item{display:flex;gap:12px;align-items:center;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-top:8px;cursor:pointer}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--bd);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--mu)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);margin:2px 2px 0 0}
.modal{position:fixed;top:0;left:0;right:0;height:var(--vh,100%);background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:5}.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.big{width:110px;height:110px;border-radius:50%;object-fit:cover;margin:0 auto 8px;display:block}
.dl{margin:6px 0}.dl b{color:var(--mu);font-weight:500;font-size:13px;display:block}
.mi{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;margin-top:6px;background:var(--cd)}
#cam,#mv{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#cam.on,#mv.on{display:flex}#cv,#mv video,#mv img{max-width:100%;max-height:78%}#mv audio{width:90%}
#cc{display:flex;gap:14px;margin-top:14px}#cc button{font-size:26px;background:#ffffff22;border:0;border-radius:50%;width:56px;height:56px;color:#fff}
.empty{text-align:center;color:var(--mu);padding:40px 10px}

#lk{display:block;overflow:auto;padding:0 0 170px;text-align:left;background:linear-gradient(#1d1145,#0b0816 55%)}
.fb{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top))}.fb b{flex:1;font-size:19px}
.lgo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#6a3df0,#e0409a);display:flex;align-items:center;justify-content:center;user-select:none}.lgo svg{width:26px;height:26px}
#fs{background:#ffffff14;border:1px solid #ffffff25;color:#fff;border-radius:99px;padding:12px 16px;margin:0}
#lk h3{margin:22px 0 10px;font-size:18px}.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.cd{width:130px;flex:none;display:flex;flex-direction:column;gap:2px;cursor:pointer}.cd b,.tr b{font-size:14px;font-weight:600}.cd span,.tr span{font-size:12px;color:#b9a9e8}
.art{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;width:100%}.art svg{width:46%}
.ga{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ga .cd{width:auto}
.tr{display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer}.tr .art{width:52px;flex:none}.tr div{display:flex;flex-direction:column}.tr i{font-style:normal;color:#e0409a;margin-left:auto}.tr small{color:#b9a9e8;width:34px;text-align:right}
.fr{padding:60px 24px;text-align:center;color:#d6caf5;font-size:17px}
.mp{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:#2a1d5a;border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;cursor:pointer}.mp .art{width:40px;flex:none}.mp div{flex:1;display:flex;flex-direction:column;font-size:13px}.mp span{color:#b9a9e8;font-size:11px}
.fn{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0e0a1f;border-top:1px solid #ffffff18;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}.fn span{flex:1;text-align:center;font-size:20px;cursor:pointer}.fn i{display:block;font-style:normal;font-size:11px;color:#b9a9e8}
.ts{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;text-align:center}.ts.on{opacity:1}
#pm .sheet input{background:#ffffff14;border-color:#ffffff30;color:#fff}
#app{padding-bottom:100px}
#nv{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:4}
#nv button{flex:1;background:none;border:0;font-size:20px;color:var(--mu)}#nv button span{display:block;font-size:11px}#nv button.on{color:var(--ac)}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 4px 14px #0004;z-index:4}
.gt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.tl{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}.tl .i{font-size:26px}.tl b{font-size:15px}.tl span{font-size:13px;color:var(--mu)}
h2.sh{font-size:15px;color:var(--mu);margin:18px 0 0;font-weight:600}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.gi{aspect-ratio:1;background:var(--bd);border-radius:10px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer}.gi img{width:100%;height:100%;object-fit:cover}
.gi u,.mi u{text-decoration:none;position:absolute;right:4px;top:4px;background:#0008;border-radius:8px;padding:2px 6px;font-size:14px}.mi u{position:static;background:none}
.seg{display:flex;gap:6px;overflow-x:auto;margin-top:6px}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}
.btn .ic{vertical-align:-4px;margin-right:3px}.bn .ic{vertical-align:-3px}
#nv button em,.fn b{display:block;line-height:0;margin-bottom:2px;font-style:normal}#nv button em svg{margin:0 auto}
.fn b{color:#a59bd0}.fn .on b,.fn .on i{color:#f0b04a}
.tl .i{color:var(--ac);line-height:0;margin-bottom:6px}.tl .i svg{width:28px;height:28px}
.tr i svg{width:20px;height:20px}#cc button{display:flex;align-items:center;justify-content:center}
  /* ===== BLAKNOT ===== */
  .blaknot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .blaknot-card{background:linear-gradient(145deg,#22334a,#1a2635);border:1.5px solid rgba(34,211,165,0.45);box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:120px}
  .blaknot-card-cat{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--green);background:rgba(34,211,165,0.1);padding:2px 7px;border-radius:20px;align-self:flex-start}
  .blaknot-card-title{font-size:13.5px;font-weight:700;color:var(--text2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .blaknot-card-snippet{font-size:11.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
  .blaknot-card-thumb{width:100%;height:70px;object-fit:cover;border-radius:8px;background:var(--blaknot-paper);border:1px solid var(--border2)}
  .blaknot-card-date{font-size:9.5px;color:var(--muted);margin-top:auto}
  .blaknot-chip{flex-shrink:0;background:var(--bg4);border:1px solid var(--border2);color:var(--text3);border-radius:20px;padding:7px 13px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .blaknot-chip.active{background:rgba(34,211,165,0.15);border-color:rgba(34,211,165,0.5);color:var(--green)}
  #blaknot-filter-chips{flex-wrap:wrap;overflow-x:visible}
  #blaknot-filter-chips .blaknot-chip{padding:13px 18px;font-size:14px;font-weight:800;border-radius:14px;flex:1 1 auto;text-align:center;border:1.5px solid rgba(34,211,165,0.45)}
  .blaknot-tool-btn{width:40px;height:40px;border-radius:10px;background:var(--bg4);border:1px solid var(--border2);color:var(--text2);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .blaknot-tool-btn.active{background:rgba(34,211,165,0.2);border-color:var(--green);color:var(--green)}
  .blaknot-swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0;padding:0}
  .blaknot-swatch.active{border-color:var(--text2);box-shadow:0 0 0 1px var(--muted)}
  /* Ko'rish rejimi (tayyor yozuv ochilganda "Tahrirlash" bosilmaguncha) —
     faqat tahrirlash uchun kerakli asboblarni yashiradi, zoom tugmasi va
     list navigatsiyasi esa doim ko'rinishda qoladi */
  #blaknot-editor-overlay.blaknot-view-mode .blaknot-edit-only{display:none !important}
  #blaknot-editor-overlay:not(.blaknot-view-mode) #blaknot-viewmode-hint{display:none !important}
  #blaknot-viewmode-hint{font-size:11.5px;font-weight:700;color:var(--green);background:rgba(34,211,165,0.1);border:1px solid rgba(34,211,165,0.35);border-radius:8px;padding:6px 10px;margin-bottom:10px;text-align:center}
  .seg-btn.active{background:rgba(34,211,165,0.2);color:var(--green);box-shadow:inset 0 0 0 1.5px rgba(34,211,165,0.5)}


  :root{--green:var(--ac);--red:var(--dg);--muted:var(--mu);--text:var(--tx);--text2:var(--tx);--text3:var(--mu);--border:var(--bd);--border2:var(--bd);--bg4:var(--bg);--bg3:var(--cd);--blaknot-paper:#f8fafc}
  .blaknot-overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:40;padding:0}
  .blaknot-overlay.open{display:flex}
  .blaknot-modal{background:var(--bg);color:var(--tx);width:100%;max-width:720px;height:100%;max-height:100%;overflow:hidden;display:flex;flex-direction:column;padding:0}
  .sabab-fs-head{display:flex;align-items:center;gap:10px;padding:12px 14px;flex:none}
  .sabab-fs-head .modal-title{flex:1;font-size:17px;font-weight:700}
  .sabab-fs-close{width:38px;height:38px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .sabab-fs-scroll{padding:12px 14px;overflow-y:auto;flex:1;min-height:0}
  .sabab-fs-foot{padding:8px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);flex:none;background:var(--bg)}
  .form-input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx)}
  .modal-btns{display:flex;gap:8px}
  .btn-cancel,.btn-save{flex:1;border-radius:10px;padding:11px;border:1px solid var(--bd);font-weight:700;cursor:pointer}
  .btn-cancel{background:var(--cd);color:var(--tx)}
  .btn-save{background:var(--ac);color:white;border-color:var(--ac)}
  .blaknot-chip{color:var(--tx)}
  .blaknot-card{background:var(--cd);border-color:var(--bd)}
  .blaknot-card-title{color:var(--tx)}
  .blaknot-card-snippet,.blaknot-card-date{color:var(--mu)}
  .blaknot-page-canvas-wrap{touch-action:pan-y}
  #blaknot-pages-stack{background:#e7ebf0}
  @media(prefers-color-scheme:dark){:root{--blaknot-paper:#eafcf4}}

/* Blaknot editor: mustaqil full-screen qatlam — #app ichidagi layout ta'sir qilmaydi */
#blaknot-editor-overlay{
 position:fixed!important;inset:0!important;
 width:100%!important;height:100vh!important;height:100dvh!important;
 min-width:0!important;max-width:none!important;min-height:0!important;
 margin:0!important;padding:0!important;border:0!important;
 display:none;align-items:stretch!important;justify-content:stretch!important;
 overflow:hidden!important;z-index:10000!important;box-sizing:border-box!important;
}
#blaknot-editor-overlay.open{display:flex!important}
#blaknot-editor-overlay>.blaknot-modal{
 display:flex!important;flex:1 1 100%!important;position:relative!important;
 width:100%!important;min-width:0!important;max-width:none!important;
 height:100%!important;min-height:0!important;max-height:none!important;
 margin:0!important;padding:0!important;border:0!important;border-radius:0!important;
 overflow:hidden!important;box-sizing:border-box!important;
}
#blaknot-editor-overlay .sabab-fs-head,
#blaknot-editor-overlay .sabab-fs-scroll,
#blaknot-editor-overlay .sabab-fs-foot{width:100%!important;min-width:0!important;box-sizing:border-box!important}
#blaknot-editor-overlay .sabab-fs-head{flex:0 0 auto}
#blaknot-editor-overlay .sabab-fs-scroll{flex:1 1 auto;min-height:0;overflow-x:hidden!important;overflow-y:auto!important;overscroll-behavior:contain}
#blaknot-editor-overlay .sabab-fs-foot{flex:0 0 auto;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))!important}
#blaknot-editor-overlay #blaknot-pages-stack{width:100%!important;max-height:min(55dvh,520px)!important;overflow-y:auto!important;overflow-x:hidden!important}
/* Klaviatura ochilganda (T rejimi): yozish oynasi tepaga ko'tarilib, bo'sh joyni to'ldiradi */
#blaknot-editor-overlay.blaknot-kb #blaknot-pages-stack{max-height:var(--nb-h)!important;height:var(--nb-h)!important}
#blaknot-editor-overlay.blaknot-kb .blaknot-page-canvas-wrap{height:var(--nb-wh)!important}
#blaknot-editor-overlay .modal-btns{display:flex!important;width:100%!important;gap:8px}
#blaknot-editor-overlay .btn-cancel,#blaknot-editor-overlay .btn-save{flex:1 1 0;min-width:0;min-height:48px;font-size:15px!important}
#nv button{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px 0}
#nv button em{display:flex!important;align-items:center;justify-content:center;line-height:1!important;width:25px;height:25px;margin:0!important;font-style:normal}
#nv button em svg{display:block;width:23px;height:23px;margin:0 auto}
#nv button span{display:block;line-height:1.2;font-size:11px;white-space:nowrap}
@media(max-width:380px){
 #blaknot-editor-overlay .sabab-fs-head{gap:6px;padding:9px 10px}
 #blaknot-editor-overlay .sabab-fs-close{width:36px;height:36px;flex-shrink:0}
 #blaknot-editor-overlay .sabab-fs-scroll{padding-left:10px;padding-right:10px}
 #blaknot-editor-overlay .blaknot-tool-btn{width:36px;height:38px}
}

<!-- BLAKNOT EDITOR — to'liq ekran, Samsung Notes uslubida (matn + chizish) -->
<div class="blaknot-overlay" id="blaknot-editor-overlay">
  <div class="blaknot-modal" style="height:100vh;max-height:100vh;border-radius:0;border-top:none;display:flex;flex-direction:column;padding:0">
    <div class="sabab-fs-head" style="border-bottom:1px solid var(--border)">
      <button class="sabab-fs-close" onclick="blaknotToggleExportMenu()" title="Fayl sifatida saqlash" aria-label="Fayl sifatida saqlash">⇩</button>
      <button class="sabab-fs-close" onclick="closeBlaknotEditor()">✕</button>
      <div class="modal-title" style="margin-bottom:0" data-i18n="blaknot_editor_title">Yozuv</div>
      <div style="display:flex;align-items:center;gap:4px">
        <button class="sabab-fs-close" id="blaknot-edit-btn" onclick="blaknotEnableEdit()" title="Tahrirlash" style="display:none">✏️</button>
        <button class="sabab-fs-close" id="blaknot-delete-btn" onclick="deleteBlaknotNoteConfirm()" style="color:var(--red);visibility:hidden">🗑</button>
      </div>
    </div>
    <div id="blaknot-export-menu" style="display:none;gap:7px;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--bg)">
      <button class="btn g" style="flex:1" onclick="blaknotExportPdf()">PDF saqlash</button>
      <button class="btn g" style="flex:1" onclick="blaknotExportWord()">Word saqlash</button>
      <button class="btn g" style="flex:1" onclick="blaknotExportExcel()">Excel saqlash</button>
    </div>
    <div class="sabab-fs-scroll" style="padding-top:12px">
      <div id="blaknot-viewmode-hint">👁 Ko'rish rejimi — tahrirlash uchun ✏️ tugmasini bosing</div>
      <input type="text" id="blaknot-input-title" class="form-input" placeholder="Sarlavha..." data-i18n-placeholder="blaknot_title_placeholder" style="font-size:16px;font-weight:700;margin-bottom:10px">
      <div id="blaknot-combo-panel">
        <div class="blaknot-edit-only" style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px">

          </button>

          <button class="blaknot-tool-btn" onclick="blaknotFontSizeDec()" title="Shriftni kichraytirish" style="font-size:13px;font-weight:800">A-</button>
        </div>

          <input type="range" id="blaknot-brush-size" class="blaknot-edit-only" min="1" max="18" value="3" style="flex:1;min-width:40px;max-width:90px">

          </button>
          <button class="blaknot-tool-btn blaknot-edit-only" onclick="blaknotUndo()" title="Bekor qilish">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
          </button>

            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
          <button class="blaknot-tool-btn blaknot-edit-only" onclick="document.getElementById('blaknot-image-input').click()" title="Rasm yuklash">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          </button>
          <button class="blaknot-tool-btn" onclick="blaknotResetZoom()" title="To'liq ko'rish (hech narsa qirqilmasin)">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V3h4"/><path d="M17 3h4v4"/><path d="M21 17v4h-4"/><path d="M7 21H3v-4"/></svg>
          </button>
          <input type="file" id="blaknot-image-input" accept="image/*" style="display:none" onchange="blaknotHandleImageUpload(event)">
          <button class="blaknot-tool-btn blaknot-edit-only" onclick="blaknotFontSizeInc()" title="Shriftni kattalashtirish (14px)" id="blaknot-fontsize-inc-btn" style="font-size:15px;font-weight:800">A+</button>
        </div>
        <div id="blaknot-pages-stack" class="no-swipe" style="position:relative;max-height:min(60vh,520px);border-radius:10px;overflow-y:auto;overflow-x:hidden;border:1.5px solid var(--border2);background:#e7ebf0;-webkit-overflow-scrolling:touch;scroll-behavior:smooth"></div>
        <div id="blaknot-page-nav" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px">
          <button class="blaknot-tool-btn" id="blaknot-page-prev-btn" onclick="blaknotPrevPage()" title="Oldingi list" style="width:32px;height:32px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <span id="blaknot-page-indicator" style="font-size:11px;font-weight:700;color:var(--text3)">1 / 1</span>
          <button class="blaknot-tool-btn" id="blaknot-page-next-btn" onclick="blaknotNextPage()" title="Keyingi list" style="width:32px;height:32px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <button class="blaknot-chip blaknot-edit-only" onclick="blaknotAddPage()" style="flex:none;padding:5px 10px;font-size:10.5px">+ Yangi list</button>
        </div>
      </div>
    </div>
    <div class="sabab-fs-foot" style="padding:6px 16px 10px">
      <div class="modal-btns" style="margin-top:0;gap:8px">
        <button class="btn-cancel" onclick="closeBlaknotEditor()" data-i18n="blaknot_cancel" style="padding:8px;font-size:12.5px">Bekor qilish</button>
        <button class="btn-save" onclick="saveBlaknotNote()" data-i18n="blaknot_save" style="padding:10px;font-size:13.5px">Saqlash</button>
      </div>
    </div>
  </div>
</div>

// Matn va chizish bitta oynada birga ko'rinadi (canvas ustida shaffof textarea).
// "T" yoki qalam tugmasi bosilganda o'sha rejim yoqiladi. AGAR ALLAQACHON FAOL
// bo'lgan tugma qayta bosilsa — rejim butunlay OʻCHADI (na T, na qalam faol),
// shunda ekranga barmoq tegishi chizish/yozishga emas, balki listlarni
// tepa-pastga SKROLL qilishga sarflanadi (Samsung Notes'dagidek).
function toggleBlaknotTextMode() {
  setBlaknotMode(_blaknotMode === 'text' ? 'none' : 'text');
}

function setBlaknotMode(mode) {
  _blaknotMode = (_blaknotMode === mode) ? 'none' : mode;
  applyBlaknotMode();
}

function applyBlaknotMode() {
  const tBtn = document.getElementById('blaknot-text-toggle-btn');
  const pBtn = document.getElementById('blaknot-draw-toggle-btn');
  const isText = !_blaknotViewOnly && _blaknotMode === 'text';
  const isDraw = !_blaknotViewOnly && _blaknotMode === 'draw';
  document.querySelectorAll('.blaknot-page-text').forEach(ta => {
    ta.readOnly = _blaknotViewOnly;
    if (_blaknotViewOnly) {
      // Ko'rish rejimida: agar matn qutidan uzunroq bo'lsa (440px balandlikdan
      // oshib ketsa), foydalanuvchi bir barmoq bilan pastga-tepaga surib
      // matnning QOLGAN qismini ko'ra olishi uchun textareaga tegishlarni
      // "auto" qilib qo'yamiz (lekin readOnly bo'lgani uchun tahrirlanmaydi).
      // Agar matn qutiga to'liq sig'sa, tegishlarni "none" qoldiramiz —
      // shunda ostidagi canvas ikki barmoqli pinch-zoom'ni davom ettira oladi.
      const needsScroll = ta.scrollHeight > ta.clientHeight + 2;
      ta.style.pointerEvents = needsScroll ? 'auto' : 'none';
      ta.style.touchAction = 'pan-y';
      ta.style.overflowY = needsScroll ? 'auto' : 'hidden';
    } else {
      ta.style.pointerEvents = isText ? 'auto' : 'none';
      ta.style.touchAction = '';
      ta.style.overflowY = '';
    }
  });
  // Chizish rejimida bo'lmasa, canvas barmoq tegishini butunlay o'tkazib
  // yuboradi (pointer-events:none) — shu orqali stack konteyneri o'zining
  // tabiiy vertikal skrollini ishlata oladi va "chizish" tasodifan sodir bo'lmaydi.
  // Ko'rish rejimida (_blaknotViewOnly) esa canvas pointer-events HAR DOIM
  // 'auto' qilib qo'yiladi — buning yagona sababi ikki barmoqli pinch-zoom
  // (yaqinlashtirish/uzoqlashtirish) ishlab turishi kerak, biroq bitta
  // barmoq bilan chizish blaknotPointerDown() ichida to'sib qo'yiladi.
  document.querySelectorAll('.blaknot-page-canvas').forEach(cv => {
    cv.style.pointerEvents = (isDraw || _blaknotViewOnly) ? 'auto' : 'none';
    cv.style.touchAction = isDraw ? 'none' : 'pan-y';
  });
  document.querySelectorAll('.blaknot-page-canvas-wrap').forEach(w => {
    w.style.touchAction = isDraw ? 'none' : 'pan-y';
  });
  if (isText) {
    const active = _blaknotPageRuntime[_blaknotPageIndex];
    if (active && active.textarea) setTimeout(() => active.textarea.focus(), 10);
  }
  if (tBtn) tBtn.classList.toggle('active', isText);
  if (pBtn) pBtn.classList.toggle('active', isDraw);
}

// Ko'rish rejimini (viewOnly) UI ga qo'llaydi: sarlavha, kategoriya va
// tahrirlash asboblarini bloklaydi/ochadi, "✏️ Tahrirlash" tugmasini
// ko'rsatadi/yashiradi.
function blaknotApplyViewMode() {
  const overlay = document.getElementById('blaknot-editor-overlay');
  if (overlay) overlay.classList.toggle('blaknot-view-mode', _blaknotViewOnly);

  if (titleInput) titleInput.readOnly = _blaknotViewOnly;
  document.querySelectorAll('#blaknot-cat-chips .blaknot-chip').forEach(c => {

// "✏️" tugmasi bosilganda — ko'rish rejimidan tahrirlash rejimiga o'tadi
function blaknotEnableEdit() {
  _blaknotViewOnly = false;

}

// ---- Shrift o'lchami (faol listga ta'sir qiladi) ----
function blaknotApplyFontSize() {
  const rt = _blaknotPageRuntime[_blaknotPageIndex];
  if (rt && rt.textarea) rt.textarea.style.fontSize = _blaknotFontSize + 'px';
  if (_blaknotPages[_blaknotPageIndex]) _blaknotPages[_blaknotPageIndex].fontSize = _blaknotFontSize;
  const incBtn = document.getElementById('blaknot-fontsize-inc-btn');
  if (incBtn) incBtn.title = "Shriftni kattalashtirish (" + _blaknotFontSize + "px)";
}

function blaknotFontSizeInc() {
  _blaknotFontSize = Math.min(28, (_blaknotFontSize || 14) + 2);
  blaknotApplyFontSize();
}

function blaknotFontSizeDec() {
  _blaknotFontSize = Math.max(10, (_blaknotFontSize || 14) - 2);
  blaknotApplyFontSize();
}

// ---- Ko'p list (sahifa) navigatsiyasi — Samsung Notes uslubidagi uzluksiz skroll ----

// Faol listni almashtiradi (asboblar — rang, o'chirg'ich, shrift — shu listga ta'sir qiladi).
// Diqqat: bu endi listni "yashirmaydi/ko'rsatmaydi" — barcha listlar doim ko'rinib turadi,
// faqat qaysi biriga chizish/yozish asboblari qo'llanishini belgilaydi.
function blaknotSetActivePage(idx) {
  if (idx < 0 || idx >= _blaknotPages.length) return;
  _blaknotPageIndex = idx;
  _blaknotFontSize = (_blaknotPages[idx] && _blaknotPages[idx].fontSize) || 14;
  const label = document.getElementById('blaknot-fontsize-label');
  if (label) label.textContent = _blaknotFontSize + 'px';
  // DIQQAT: bu yerda o'chirg'ich (_blaknotEraser) endi OFF qilinmaydi.
  // Avval har bir barmoq tegishida (pointerdown -> blaknotSetActivePage)
  // o'chirg'ich o'chib qolardi va u hech qachon ishlamasdi.
  blaknotRenderSwatches();
  blaknotUpdatePageIndicator();
  document.querySelectorAll('.blaknot-page-block').forEach((el, i) => {
    el.style.outline = (i === idx) ? '2px solid var(--green)' : 'none';
    el.style.outlineOffset = '-2px';
  });
}

function blaknotUpdatePageIndicator() {
  const el = document.getElementById('blaknot-page-indicator');
  if (el) el.textContent = (_blaknotPageIndex + 1) + ' / ' + _blaknotPages.length;
  const prevBtn = document.getElementById('blaknot-page-prev-btn');
  const nextBtn = document.getElementById('blaknot-page-next-btn');
  if (prevBtn) prevBtn.style.opacity = _blaknotPageIndex === 0 ? '0.4' : '1';
  if (nextBtn) nextBtn.style.opacity = _blaknotPageIndex === _blaknotPages.length - 1 ? '0.4' : '1';
}

// Joriy holatni (matn + chizma) barcha listlardan _blaknotPages massiviga yozib oladi
function blaknotCaptureAllPages() {
  _blaknotPageRuntime.forEach((rt, idx) => {
    const page = _blaknotPages[idx];
    if (!page || !rt) return;
    if (rt.textarea) page.text = rt.textarea.value;
    if (rt.canvasTouched) {
      const hasContent = rt.strokes.length > 0 || !!rt.baseImage;
      page.drawing = (hasContent && rt.canvas) ? rt.canvas.toDataURL('image/png') : null;
    }
  });
}

// Stack ichidagi biror list blokiga silliq skroll qiladi
function blaknotScrollToPage(idx) {
  const block = document.querySelector('.blaknot-page-block[data-page-idx="' + idx + '"]');
  if (block) block.scrollIntoView({ behavior: 'smooth', block: 'start' });
  blaknotSetActivePage(idx);
}

function blaknotPrevPage() {
  if (_blaknotPageIndex <= 0) return;
  blaknotScrollToPage(_blaknotPageIndex - 1);
}

function blaknotNextPage() {
  if (_blaknotPageIndex >= _blaknotPages.length - 1) return;
  blaknotScrollToPage(_blaknotPageIndex + 1);
}

function blaknotAddPage() {
  blaknotCaptureAllPages();
  _blaknotPages.push({ text: '', drawing: null, fontSize: _blaknotFontSize });
  blaknotRenderPagesStack();
  applyBlaknotMode();
  setTimeout(() => blaknotScrollToPage(_blaknotPages.length - 1), 40);
}

// Barcha listlarni bitta uzluksiz skrollanadigan varaq ichida qayta chizadi
function blaknotRenderPagesStack() {
  if (_blaknotStackObserver) { _blaknotStackObserver.disconnect(); _blaknotStackObserver = null; }
  const stack = document.getElementById('blaknot-pages-stack');
  if (!stack) return;
  stack.innerHTML = '';
  _blaknotPageRuntime = _blaknotPages.map(() => ({
    strokes: [], currentStroke: null, drawingActive: false, ctx: null,
    canvas: null, wrap: null, textarea: null, canvasW: 0, canvasH: 0,
    baseImage: null, pendingDrawingSrc: null, canvasTouched: false,
    zoom: 1, panX: 0, panY: 0, pointers: new Map(), gesture: null, activeDrawPointerId: null,
    imgScale: null, imgOffX: 0, imgOffY: 0
  }));

  _blaknotPages.forEach((page, idx) => {
    const block = document.createElement('div');
    block.className = 'blaknot-page-block';
    block.setAttribute('data-page-idx', String(idx));
    block.style.cssText = 'position:relative;border-bottom:8px solid #cbd5e1;';
    const label = document.createElement('div');
    label.textContent = (idx + 1) + '-bet';
    label.style.cssText = 'font-size:10px;font-weight:700;color:#94a3b8;padding:6px 10px 0;background:var(--blaknot-paper)';
    block.appendChild(label);

    const wrap = document.createElement('div');
    wrap.className = 'blaknot-page-canvas-wrap';
    wrap.style.cssText = 'position:relative;height:440px;overflow:hidden;background:var(--blaknot-paper);touch-action:' + (_blaknotMode === 'draw' ? 'none' : 'pan-y');
    const canvas = document.createElement('canvas');
    canvas.className = 'blaknot-page-canvas';
    canvas.style.cssText = 'display:block;touch-action:none;position:absolute;top:0;left:0;z-index:1;pointer-events:' + (_blaknotMode === 'draw' ? 'auto' : 'none');
    const textarea = document.createElement('textarea');
    textarea.className = 'blaknot-page-text';
    textarea.placeholder = "Qoida, strategiya yoki eslatmangizni yozing...";
    textarea.value = page.text || '';
    textarea.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;resize:none;border:none;outline:none;background:transparent;padding:10px;font-size:' + (page.fontSize || 14) + 'px;line-height:1.5;color:#0f172a;font-family:inherit;z-index:2;pointer-events:' + (_blaknotMode === 'text' ? 'auto' : 'none');
    wrap.appendChild(canvas);
    wrap.appendChild(textarea);
    block.appendChild(wrap);
    stack.appendChild(block);

    const rt = _blaknotPageRuntime[idx];
    rt.wrap = wrap; rt.canvas = canvas; rt.textarea = textarea;
    rt.pendingDrawingSrc = page.drawing || null;

    textarea.addEventListener('focus', () => { blaknotSetActivePage(idx); setTimeout(blaknotKbLayout, 350); });
    textarea.addEventListener('blur', () => setTimeout(blaknotKbLayout, 250));
    textarea.addEventListener('input', () => { page.text = textarea.value; });
    canvas.addEventListener('pointerdown', (e) => { blaknotSetActivePage(idx); blaknotPointerDown(e, idx); });
    canvas.addEventListener('pointermove', (e) => blaknotPointerMove(e, idx));
    canvas.addEventListener('pointerup', (e) => blaknotPointerUp(e, idx));
    canvas.addEventListener('pointercancel', (e) => blaknotPointerUp(e, idx));
  });

  setTimeout(() => {
    _blaknotPages.forEach((page, idx) => blaknotSetupCanvas(idx));
    blaknotSetActivePage(_blaknotPageIndex < _blaknotPages.length ? _blaknotPageIndex : 0);
    // Layout joylashib bo'lgach, uzun matnli listlar uchun ichki skrollni
    // to'g'ri yoqish uchun qayta hisoblaymiz (scrollHeight endi aniq bo'ladi).
    applyBlaknotMode();
  }, 30);

  // Skroll paytida qaysi list eng ko'p ko'rinib turgan bo'lsa, o'shani "faol" qiladi
  // va pastdagi ko'rsatkichni (masalan "2 / 3") shunga qarab yangilaydi.
  _blaknotStackObserver = new IntersectionObserver((entries) => {
    let best = null;
    entries.forEach(en => {
      if (en.isIntersecting && (!best || en.intersectionRatio > best.intersectionRatio)) best = en;
    });
    if (best) {
      const idx = parseInt(best.target.getAttribute('data-page-idx'), 10);
      if (!isNaN(idx) && idx !== _blaknotPageIndex) blaknotSetActivePage(idx);
    }
  }, { root: stack, threshold: [0.3, 0.5, 0.7] });
  document.querySelectorAll('.blaknot-page-block').forEach(el => _blaknotStackObserver.observe(el));
}

// Klaviatura ochilganda: sarlavha/asboblar tepaga siljib chiqib ketadi, yozish oynasi
// ko'rinadigan joyni to'ldiradi. Oynani pastga surib asboblarni qayta ko'rish mumkin;
// klaviatura yopilganda (yoki yozish oynasidan chiqilganda) avvalgi joyiga qaytadi.
let _nbKbSavedScroll = null, _nbKbLastH = 0;
function blaknotKbLayout() {
  const ov = document.getElementById('blaknot-editor-overlay');
  if (!ov || !ov.classList.contains('open')) return;
  const sc = ov.querySelector('.sabab-fs-scroll');
  const stack = document.getElementById('blaknot-pages-stack');
  if (!sc || !stack) return;
  const ae = document.activeElement;
  const focused = ae && ae.classList && ae.classList.contains('blaknot-page-text');
  if (!focused) {
    if (ov.classList.contains('blaknot-kb')) {
      ov.classList.remove('blaknot-kb');
      ov.style.removeProperty('--nb-h');
      ov.style.removeProperty('--nb-wh');
      if (_nbKbSavedScroll != null) sc.scrollTo({ top: _nbKbSavedScroll, behavior: 'smooth' });
    }
    _nbKbSavedScroll = null; _nbKbLastH = 0;
    return;
  }
  if (_nbKbSavedScroll == null) _nbKbSavedScroll = sc.scrollTop;
  const h = Math.max(180, sc.clientHeight - 16);
  if (ov.classList.contains('blaknot-kb') && Math.abs(h - _nbKbLastH) < 4) return;
  _nbKbLastH = h;
  ov.style.setProperty('--nb-h', h + 'px');
  ov.style.setProperty('--nb-wh', Math.max(150, h - 26) + 'px');

function openBlaknotEditor(id) {
  // Eslatma: _blaknotNotes ilova ishga tushganda va har bir saqlash/o'chirishdan
  // so'ng doim yangilanib turadi, shuning uchun bu yerda qayta yuklash shart emas
  // (IndexedDB asinxron bo'lgani uchun bu yerda qayta yuklash kodni murakkablashtirar edi).
  _blaknotEditingId = id || null;
  const note = id ? _blaknotNotes.find(n => n.id === id) : null;
  const overlay = document.getElementById('blaknot-editor-overlay');
  // Editorni body ichiga chiqaramiz: ota konteynerning overflow'i siqmaydi.
  if (overlay && overlay.parentElement !== document.body) document.body.appendChild(overlay);
  const titleInput = document.getElementById('blaknot-input-title');
  if (titleInput) titleInput.value = note ? (note.title || '') : '';
  _blaknotEditorCat = note ? (note.category || 'qoida') : 'qoida';
  document.querySelectorAll('#blaknot-cat-chips .blaknot-chip').forEach(c => {

  // Eski (bir listli) yozuvlarni ko'p listli formatga o'giradi
  if (note && Array.isArray(note.pages) && note.pages.length) {
    _blaknotPages = note.pages.map(p => ({ text: p.text || '', drawing: p.drawing || null, fontSize: p.fontSize || 14 }));
  } else if (note) {
    _blaknotPages = [{ text: note.text || '', drawing: note.drawing || null, fontSize: note.fontSize || 14 }];
  } else {
    _blaknotPages = [{ text: '', drawing: null, fontSize: 14 }];
  }
  _blaknotPageIndex = 0;
  _blaknotEraser = false;
  const eraserBtn = document.getElementById('blaknot-eraser-btn');
  if (eraserBtn) eraserBtn.classList.remove('active');

  if (overlay) overlay.classList.add('open');
  _blaknotMode = 'draw';
  // Tayyor (mavjud) yozuv ochilsa — avval faqat KO'RISH rejimida ochiladi
  // (matn/chizish ishlamaydi, ✏️ tugmasi bosilgandagina tahrirlash yoqiladi).
  // Yangi yozuv esa to'g'ridan-to'g'ri tahrirlash rejimida ochiladi.
  _blaknotViewOnly = !!note;
  blaknotApplyViewMode();
  // Barcha listlarni bitta uzluksiz skrollanadigan varaqda tuzadi (Samsung Notes uslubi)
  blaknotRenderPagesStack();
  applyBlaknotMode();
  blaknotRenderSwatches();
  blaknotUpdatePageIndicator();
  const fab = document.getElementById('blaknot-fab');
  if (fab) fab.style.display = 'none';

function closeBlaknotEditor() {
  const overlay = document.getElementById('blaknot-editor-overlay');

  if (catOverlay) catOverlay.classList.remove('open');

  _blaknotEditingId = null;
  _blaknotViewOnly = false;
  if (overlay) overlay.classList.remove('blaknot-view-mode');

  if (overlay) { overlay.classList.remove('blaknot-kb'); overlay.style.removeProperty('--nb-h'); overlay.style.removeProperty('--nb-wh'); }

async function blaknotRenderPdfPages(d){
  const W=1240,H=1754,M=90,LH=44,FONT='Arial, Helvetica, sans-serif';
  const cvs=[];let ctx,y;
  const newPage=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#172033';ctx.textBaseline='top';y=M;cvs.push(c);};
  const wrap=(text,maxW)=>{const out=[];String(text||'').split(/\r?\n/).forEach(par=>{if(!par){out.push('');return;}let line='';par.split(' ').forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width<=maxW){line=t;return;}if(line)out.push(line);line=w;while(ctx.measureText(line).width>maxW&&line.length>1){let k=line.length-1;while(k>1&&ctx.measureText(line.slice(0,k)).width>maxW)k--;out.push(line.slice(0,k));line=line.slice(k);}});out.push(line);});return out;};
  const put=(lines,lh)=>{lines.forEach(l=>{if(y+lh>H-M)newPage();ctx.fillText(l,M,y);y+=lh;});};
  newPage();
  ctx.font='bold 46px '+FONT;put(wrap(d.title,W-2*M),58);y+=6;
  ctx.font='24px '+FONT;ctx.fillStyle='#667085';put([d.date+(d.category?'  •  '+d.category:'')],34);ctx.fillStyle='#172033';y+=24;
  for(let i=0;i<d.pages.length;i++){
    const p=d.pages[i];
    if(d.pages.length>1){if(y+60>H-M)newPage();ctx.font='bold 22px '+FONT;ctx.fillStyle='#94a3b8';put([(i+1)+'-bet'],32);ctx.fillStyle='#172033';}
    if(p.text){ctx.font='30px '+FONT;put(wrap(p.text,W-2*M),LH);y+=10;}
    if(p.drawing){
      const im=await blaknotLoadImg(p.drawing);
      let w=W-2*M,h=w*im.height/im.width;
      const maxH=H-2*M;if(h>maxH){h=maxH;w=h*im.width/im.height;}
      if(y+h>H-M)newPage();
      ctx.drawImage(im,M,y,w,h);ctx.strokeStyle='#cbd5e1';ctx.lineWidth=2;ctx.strokeRect(M,y,w,h);y+=h+30;

}
function blaknotMakePdf(jpegs){
  const enc=new TextEncoder(),chunks=[],offs=[];let off=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;chunks.push(b);off+=b.length;};
  const obj=(id,fn)=>{offs[id]=off;push(id+' 0 obj\n');fn();push('\nendobj\n');};
  const n=jpegs.length;
  push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Kids ['+jpegs.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] /Count '+n+' >>'));
  jpegs.forEach((j,i)=>{
    const pid=3+i*3,cid=pid+1,iid=pid+2,content='q 595 0 0 842 0 0 cm /Im0 Do Q';
    obj(pid,()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>'));
    obj(cid,()=>push('<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream'));
    obj(iid,()=>{push('<< /Type /XObject /Subtype /Image /Width '+j.w+' /Height '+j.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.bytes.length+' >>\nstream\n');push(j.bytes);push('\nendstream');});
  });
  const xref=off,total=3*n+3;
  push('xref\n0 '+total+'\n0000000000 65535 f \n');
  for(let id=1;id<total;id++)push(String(offs[id]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
  return new Blob(chunks,{type:'application/pdf'});
}

function saveBlaknotNote() {
  const titleInput = document.getElementById('blaknot-input-title');
  const title = titleInput ? titleInput.value.trim() : '';
  blaknotCaptureAllPages();
  const existing = _blaknotEditingId ? _blaknotNotes.find(n => n.id === _blaknotEditingId) : null;

  const pagesToSave = _blaknotPages.map(p => ({ text: p.text || '', drawing: p.drawing || null, fontSize: p.fontSize || 14 }));
  const hasAnyContent = title || pagesToSave.some(p => (p.text && p.text.trim()) || p.drawing);
  if (!hasAnyContent) {
    showAlertModal("Yozuv bo'sh. Sarlavha, matn yoki chizma qo'shing.");
    return;
  }

  // Sirlar omborida barcha yozuvlar bitta umumiy ro'yxatda saqlanadi.
  // Kategoriya/filtr tanlash yo'q: sarlavha va yozuv darhol saqlanadi.
  blaknotFinishSave(title, pagesToSave, existing, 'note');
}

// Bo'lim tanlash oynasida foydalanuvchi bir bo'limni bosganda chaqiriladi.
function blaknotConfirmSaveCat(cat) {
  const catOverlay = document.getElementById('blaknot-catpick-overlay');
  if (catOverlay) catOverlay.classList.remove('open');
  if (!_blaknotPendingSave) return;
  _blaknotEditorCat = cat;
  blaknotFinishSave(_blaknotPendingSave.title, _blaknotPendingSave.pagesToSave, null, cat);
  _blaknotPendingSave = null;
}

function blaknotFinishSave(title, pagesToSave, existing, cat) {
  const now = Date.now();
  if (existing) {
    existing.title = title;
    existing.category = cat;
    existing.pages = pagesToSave;
    delete existing.text;
    delete existing.drawing;
    existing.updatedAt = now;
  } else {
    _blaknotNotes.push({
      id: 'bn_' + now + '_' + Math.random().toString(36).slice(2, 7),
      title, category: cat, pages: pagesToSave,
      createdAt: now, updatedAt: now
    });
  }
  saveBlaknotNotes();
  renderBlaknotList();
  closeBlaknotEditor();
}

function deleteBlaknotNoteConfirm() {
  if (!_blaknotEditingId) return;
  showConfirmModal({
    message: "Ushbu yozuvni o'chirishni istaysizmi?",
    danger: true,
    onConfirm: () => {
      _blaknotNotes = _blaknotNotes.filter(n => n.id !== _blaknotEditingId);
      saveBlaknotNotes();
      renderBlaknotList();
      closeBlaknotEditor();
    }
  });
}

// Chizma "varag'i" ko'rinadigan oynadan kattaroq qilib o'lchanadi — shu sabab
// uzoqlashtirilganda (zoom out) atrofda qo'shimcha bo'sh joy ko'rinadi va
// yaqinlashtirilganda (zoom in) mayda tafsilotlarni qulay chizish/yozish mumkin.
function blaknotSetupCanvas(idx) {
  const rt = _blaknotPageRuntime[idx];
  if (!rt || !rt.canvas || !rt.wrap) return;
  const rect = rt.wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const baseW = Math.max(Math.round(rect.width), 260);
  const baseH = Math.max(Math.round(rect.height), 260);
  const w = Math.round(baseW * 2.0);
  const h = Math.round(baseH * 2.2);
  rt.canvas.style.width = w + 'px';
  rt.canvas.style.height = h + 'px';
  rt.canvas.width = Math.round(w * dpr);
  rt.canvas.height = Math.round(h * dpr);
  const ctx = rt.canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  rt.ctx = ctx;
  rt.canvasW = w;
  rt.canvasH = h;
  // Varaq (canvas) ko'rinadigan oynadan ATAYIN kattaroq qilib olinadi (yuqoridagi
  // izohga qarang), shu sabab AVVAL butun list/rasm to'liq ko'rinadigan qilib
  // "sig'diruvchi" (fit) zoom bilan ochiladi — foydalanuvchi darhol pastini yoki
  // chetlarini yo'qotmasdan hamma narsani ko'radi, keyin xohlasa mayda
  // tafsilotlarni ko'rish uchun ikki barmoq bilan yaqinlashtira oladi.
  blaknotFitZoom(idx);
  if (!rt.canvasTouched) {
    rt.canvasTouched = true;
    if (rt.pendingDrawingSrc) {
      const img = new Image();
      img.onload = () => {
        rt.baseImage = img;
        // Avvaldan saqlangan (allaqachon butun varaqqa moslab tekislangan)
        // tasvir — hech narsa qirqilmasdan to'liq qaytariladi.
        blaknotApplyImgFit(idx, 'contain');
        blaknotRedraw(idx);
      };
      img.src = rt.pendingDrawingSrc;
    }
  }
  blaknotRedraw(idx);
}

// Rasmning canvas ICHIDAGI haqiqiy o'lchami/joylashuvini hisoblaydi.
// mode='cover'  -> butun canvas'ni to'ldiradi (bo'sh joy qolmaydi, ortiqchasi qirqiladi)
// mode='contain'-> rasm hech qirqilmasdan to'liq ko'rinadi (kerak bo'lsa bo'sh joy qoladi)
function blaknotComputeImgFit(rt, mode) {
  if (!rt || !rt.baseImage || !rt.canvasW || !rt.canvasH) return null;
  const iw = rt.baseImage.naturalWidth || rt.baseImage.width || rt.canvasW;
  const ih = rt.baseImage.naturalHeight || rt.baseImage.height || rt.canvasH;
  const scale = mode === 'contain'
    ? Math.min(rt.canvasW / iw, rt.canvasH / ih)
    : Math.max(rt.canvasW / iw, rt.canvasH / ih);
  return { scale, offX: (rt.canvasW - iw * scale) / 2, offY: (rt.canvasH - ih * scale) / 2 };
}

function blaknotApplyImgFit(idx, mode) {
  const rt = _blaknotPageRuntime[idx];
  const fit = blaknotComputeImgFit(rt, mode);
  if (!fit) return;
  rt.imgScale = fit.scale;
  rt.imgOffX = fit.offX;
  rt.imgOffY = fit.offY;
}

function blaknotApplyZoom(idx) {
  const rt = _blaknotPageRuntime[idx];
  if (!rt || !rt.canvas) return;
  rt.canvas.style.transformOrigin = '0 0';
  rt.canvas.style.transform = 'translate(' + rt.panX + 'px,' + rt.panY + 'px) scale(' + rt.zoom + ')';
}

// Butun list (va undagi rasm) — qirqilmasdan — ko'rinadigan oyna ichiga
// TO'LIQ sig'adigan qilib zoom va pan hisoblaydi, so'ng markazga joylashtiradi.
// Bu FAQAT o'sha listning ICHKI ko'rinishini o'zgartiradi (canvas
// wrap'ining overflow:hidden konteyneri ichida) — butun ekranga yoki
// ilovaning boshqa qismlariga hech qanday ta'sir qilmaydi.
function blaknotFitZoom(idx) {
  const rt = _blaknotPageRuntime[idx];
  if (!rt || !rt.wrap || !rt.canvasW || !rt.canvasH) return;
  const rect = rt.wrap.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const fitZoom = Math.min(rect.width / rt.canvasW, rect.height / rt.canvasH, 1);
  rt.zoom = Math.max(BLAKNOT_ZOOM_MIN, Math.min(BLAKNOT_ZOOM_MAX, fitZoom));
  rt.panX = (rect.width - rt.canvasW * rt.zoom) / 2;
  rt.panY = (rect.height - rt.canvasH * rt.zoom) / 2;
  blaknotApplyZoom(idx);
}

// "↺" (Asl holatga qaytarish) tugmasi endi literal 1:1 o'lchamga emas,
// balki listning TO'LIQ (hech narsa qirqilmagan) ko'rinishiga qaytaradi —
// shunda rasm qirqilib qolgan bo'lsa ham, bu tugma bosilganda darhol
// butunligicha ko'rinadi.
function blaknotResetZoom() {
  const idx = _blaknotPageIndex;
  const rt = _blaknotPageRuntime[idx];
  if (rt && rt.baseImage) {
    // Rasmni ham foydalanuvchi pinch-zoom bilan sozlagan holatidan qaytarib,
    // hech narsa qirqilmasdan to'liq ko'rinadigan qilib qo'yadi.
    blaknotApplyImgFit(idx, 'contain');
    blaknotRedraw(idx);
  }
  blaknotFitZoom(idx);
}

// Ekran koordinatasini (zoom/pan hisobga olingan holda) chizma varag'ining
// haqiqiy (logik) koordinatasiga o'giradi.
function blaknotPointerPos(e, idx) {
  const rt = _blaknotPageRuntime[idx];
  const rect = rt.wrap.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left - rt.panX) / rt.zoom,
    y: (e.clientY - rect.top - rt.panY) / rt.zoom
  };
}

function blaknotStartGesture(idx) {
  const rt = _blaknotPageRuntime[idx];
  const pts = Array.from(rt.pointers.values());
  if (pts.length < 2) return;
  const [a, b] = pts;
  const dist = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
  rt.gesture = {
    startDist: dist,
    startZoom: rt.zoom,
    startPanX: rt.panX,
    startPanY: rt.panY,
    startCx: cx,
    startCy: cy
  };
  // Agar sahifada rasm bo'lsa — ikki barmoq endi UMUMIY ko'rinishni emas,
  // balki AYNAN RASMNING o'zini (haqiqiy, saqlanadigan holatini)
  // yaqinlashtirish/uzoqlashtirish va suzish uchun ishlatiladi.
  if (rt.baseImage && rt.canvasW && rt.canvasH) {
    const rect = rt.wrap.getBoundingClientRect();
    const logicalX = (cx - rect.left - rt.panX) / rt.zoom;
    const logicalY = (cy - rect.top - rt.panY) / rt.zoom;
    const fitContain = blaknotComputeImgFit(rt, 'contain');
    const fitCover = blaknotComputeImgFit(rt, 'cover');
    rt.gesture.imgMode = true;
    rt.gesture.startImgScale = rt.imgScale != null ? rt.imgScale : (fitCover ? fitCover.scale : 1);
    rt.gesture.startImgOffX = rt.imgOffX;
    rt.gesture.startImgOffY = rt.imgOffY;
    rt.gesture.imgPointX = (logicalX - rt.gesture.startImgOffX) / rt.gesture.startImgScale;
    rt.gesture.imgPointY = (logicalY - rt.gesture.startImgOffY) / rt.gesture.startImgScale;
    rt.gesture.imgMinScale = fitContain ? fitContain.scale * 0.3 : 0.05;
    rt.gesture.imgMaxScale = fitContain ? fitContain.scale * 8 : 20;
  }
}

// Bir barmoq — chizadi (qalam rejimida). Ikki barmoq — istalgan vaqtda
// varaqni ikki barmoq bilan yaqinlashtirish/uzoqlashtirish (pinch-zoom) va
// suza olish (pan) imkonini beradi — chizmachilik dasturlaridagidek.
function blaknotPointerDown(e, idx) {
  const rt = _blaknotPageRuntime[idx];
  if (!rt || !rt.ctx) return;
  rt.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (rt.pointers.size >= 2) {
    // Ikki barmoq — pinch-zoom har doim ishlaydi (ko'rish rejimida ham,
    // tahrirlash rejimida ham), shu sabab bu yerda viewOnly tekshirilmaydi.
    e.preventDefault();
    try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
    if (rt.activeDrawPointerId !== null) {
      rt.currentStroke = null;
      rt.drawingActive = false;
      rt.activeDrawPointerId = null;
      blaknotRedraw(idx);
    }
    blaknotStartGesture(idx);
    return;
  }

  // Bitta barmoq: faqat "chizish" rejimi FAOL bo'lganda va ko'rish rejimida
  // BO'LMAGANDA chizadi. Aks holda hech narsa qilinmaydi — event
  // to'xtatilmaydi, shu orqali barmoq tegishi varaqni tabiiy skroll qilish
  // (pan-y) uchun ishlatiladi.
  if (_blaknotViewOnly || _blaknotMode !== 'draw') return;

  e.preventDefault();
  try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
  rt.activeDrawPointerId = e.pointerId;
  rt.drawingActive = true;
  const p = blaknotPointerPos(e, idx);
  rt.currentStroke = {
    color: _blaknotEraser ? '#ffffff' : _blaknotColor,
    size: _blaknotEraser ? Math.max(_blaknotSize * 4, 18) : _blaknotSize,
    points: [p]
  };
}

function blaknotPointerMove(e, idx) {
  const rt = _blaknotPageRuntime[idx];
  if (!rt) return;
  if (rt.pointers.has(e.pointerId)) {
    rt.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }

  if (rt.pointers.size >= 2 && rt.gesture) {
    e.preventDefault();
    const pts = Array.from(rt.pointers.values());
    const [a, b] = pts;
    const dist = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;

    if (rt.gesture.imgMode) {
      // Rasmning haqiqiy o'lchami/joylashuvini o'zgartiradi (ko'rinish
      // transform'i emas) — shu sabab "Saqlash" bosilganda aynan shu holat
      // saqlanadi.
      let newImgScale = rt.gesture.startImgScale * (dist / rt.gesture.startDist);
      newImgScale = Math.min(rt.gesture.imgMaxScale, Math.max(rt.gesture.imgMinScale, newImgScale));
      const rect = rt.wrap.getBoundingClientRect();
      const midLogicalX = (cx - rect.left - rt.panX) / rt.zoom;
      const midLogicalY = (cy - rect.top - rt.panY) / rt.zoom;
      rt.imgOffX = midLogicalX - rt.gesture.imgPointX * newImgScale;
      rt.imgOffY = midLogicalY - rt.gesture.imgPointY * newImgScale;
      rt.imgScale = newImgScale;
      blaknotRedraw(idx);
      return;
    }

    let newZoom = rt.gesture.startZoom * (dist / rt.gesture.startDist);
    newZoom = Math.min(BLAKNOT_ZOOM_MAX, Math.max(BLAKNOT_ZOOM_MIN, newZoom));

    const rect = rt.wrap.getBoundingClientRect();
    const localStartCx = rt.gesture.startCx - rect.left;
    const localStartCy = rt.gesture.startCy - rect.top;
    const logicalX = (localStartCx - rt.gesture.startPanX) / rt.gesture.startZoom;
    const logicalY = (localStartCy - rt.gesture.startPanY) / rt.gesture.startZoom;
    const localCx = cx - rect.left;
    const localCy = cy - rect.top;

    rt.panX = localCx - logicalX * newZoom;
    rt.panY = localCy - logicalY * newZoom;
    rt.zoom = newZoom;
    blaknotApplyZoom(idx);
    return;
  }

  if (!rt.drawingActive || !rt.currentStroke || e.pointerId !== rt.activeDrawPointerId) return;
  e.preventDefault();
  const p = blaknotPointerPos(e, idx);
  rt.currentStroke.points.push(p);
  blaknotRedraw(idx);
}

function blaknotPointerUp(e, idx) {
  const rt = _blaknotPageRuntime[idx];
  if (!rt) return;
  rt.pointers.delete(e.pointerId);
  if (rt.pointers.size < 2) rt.gesture = null;

  if (e.pointerId === rt.activeDrawPointerId) {
    rt.drawingActive = false;
    rt.activeDrawPointerId = null;
    if (rt.currentStroke && rt.currentStroke.points.length >= 1) {
      rt.strokes.push(rt.currentStroke);
    }
    rt.currentStroke = null;
    blaknotRedraw(idx);
  }
}

function blaknotRedraw(idx) {
  const rt = _blaknotPageRuntime[idx];
  const ctx = rt && rt.ctx;
  if (!ctx) return;
  ctx.clearRect(0, 0, rt.canvasW, rt.canvasH);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, rt.canvasW, rt.canvasH);
  // Varaqning qirrasini (chegarasini) ko'rsatib turadigan yupqa chiziq —
  // foydalanuvchi listni kattalashtirib/kichraytirib ko'rganda, chizma
  // qayerda tugashini ko'rib turishi uchun.
  ctx.save();
  ctx.strokeStyle = 'rgba(148,163,184,0.6)';
  ctx.lineWidth = Math.max(1, 1 / rt.zoom);
  ctx.setLineDash([Math.max(4, 4 / rt.zoom), Math.max(4, 4 / rt.zoom)]);
  ctx.strokeRect(0.5, 0.5, rt.canvasW - 1, rt.canvasH - 1);
  ctx.restore();
  if (rt.baseImage) {
    try {
      // Rasm foydalanuvchi ikki barmoq bilan sozlagan (yaqinlashtirilgan/
      // uzoqlashtirilgan va suzilgan) haqiqiy o'lcham/joylashuvida chiziladi —
      // shu bilan "Saqlash" bosilganda aynan shu holat saqlanadi (nisbati
      // buzilmaydi, faqat cho'zilmasdan kattalashadi/kichrayadi).
      if (rt.imgScale == null) blaknotApplyImgFit(idx, 'cover');
      const iw = rt.baseImage.naturalWidth || rt.baseImage.width || rt.canvasW;
      const ih = rt.baseImage.naturalHeight || rt.baseImage.height || rt.canvasH;
      const dw = iw * rt.imgScale, dh = ih * rt.imgScale;
      ctx.drawImage(rt.baseImage, rt.imgOffX, rt.imgOffY, dw, dh);
    } catch (e) {}
  }
  const all = rt.currentStroke ? rt.strokes.concat([rt.currentStroke]) : rt.strokes;
  all.forEach(s => {
    if (!s.points.length) return;
    if (s.points.length === 1) {
      ctx.beginPath();
      ctx.fillStyle = s.color;
      ctx.arc(s.points[0].x, s.points[0].y, s.size / 2, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.size;
    ctx.moveTo(s.points[0].x, s.points[0].y);
    for (let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
    ctx.stroke();
  });
}

function blaknotUndo() {
  const idx = _blaknotPageIndex;
  const rt = _blaknotPageRuntime[idx];
  if (!rt) return;
  if (rt.strokes.length > 0) {
    rt.strokes.pop();
  } else if (rt.baseImage) {
    rt.baseImage = null;
  }
  blaknotRedraw(idx);
}

function blaknotHandleImageUpload(e) {
  const idx = _blaknotPageIndex;
  const rt = _blaknotPageRuntime[idx];
  const file = e.target.files && e.target.files[0];
  if (!file || !rt) return;
  const reader = new FileReader();
  reader.onload = function (ev) {
    const img = new Image();
    img.onload = () => {
      rt.baseImage = img;
      rt.canvasTouched = true;
      // Yangi yuklangan rasm — birinchi holatda BUTUN varaqni to'ldiradigan
      // ("cover") qilib joylashtiriladi, so'ng kerak bo'lsa ikki barmoq
      // bilan yaqinlashtirib/uzoqlashtirib va suzib sozlash mumkin.
      blaknotApplyImgFit(idx, 'cover');
      blaknotRedraw(idx);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function blaknotClearCanvas() {
  const idx = _blaknotPageIndex;
  const rt = _blaknotPageRuntime[idx];
  if (!rt) return;
  if (rt.strokes.length === 0 && !rt.baseImage) return;
  showConfirmModal({
    message: "Chizmani tozalashni istaysizmi?",
    danger: true,
    onConfirm: () => {
      rt.strokes = [];
      rt.baseImage = null;
      blaknotRedraw(idx);
    }
  });
}

document.addEventListener('DOMContentLoaded', function () {
  const picker = document.getElementById('blaknot-color-picker');
  if (picker) {
    picker.addEventListener('input', function (e) {
      _blaknotColor = e.target.value;
      _blaknotEraser = false;
      const eraserBtn = document.getElementById('blaknot-eraser-btn');
      if (eraserBtn) eraserBtn.classList.remove('active');
      blaknotRenderSwatches();
    });
  }
  const sizeInput = document.getElementById('blaknot-brush-size');
  if (sizeInput) {
    sizeInput.addEventListener('input', function (e) {
      _blaknotSize = parseInt(e.target.value, 10) || 3;
    });
  }
  // Diqqat: chizish canvaslari endi har bir list uchun blaknotRenderPagesStack()
  // ichida dinamik yaratiladi va shu yerda pointer listenerlari ulanadi.
  blaknotRenderSwatches();
  loadBlaknotNotes().then(() => { renderBlaknotList(); });
  const blaknotFab = document.getElementById('blaknot-fab');
  if (blaknotFab) blaknotFab.style.display = (typeof tab !== 'undefined' && tab === 'notebook') ? 'flex' : 'none';
});
