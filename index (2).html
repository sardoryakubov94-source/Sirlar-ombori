 $("s3").onclick=()=>{if(typeof XLSX==="undefined")return alert("Excel kutubxonasi yuklanmadi (internet kerak)");if(!confirm("Excel fayl shifrlanmagan va media’siz saqlanadi. Davom etilsinmi?"))return;
  const ws=XLSX.utils.aoa_to_sheet([H,...S.people.map(p=>[p.name,p.cat,(p.phones||"").replace(/\n/g,", "),p.bday,p.city,p.job,p.where,p.social,p.benefit,p.note])]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Royxat");saveFile("royxat.xlsx",XLSX.write(wb,{bookType:"xlsx",type:"array"}))};
 $("s4").onclick=()=>typeof XLSX==="undefined"?alert("Excel kutubxonasi yuklanmadi (internet kerak)"):$("fx").click();
 $("fx").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{
  const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:"",raw:false});
  const g=(r,ks)=>{for(const k in r){const l=k.toLowerCase().replace(/[‘’'`]/g,"");if(ks.some(x=>l.includes(x)))return String(r[k]).trim()}return""};
  let n=0,sk=0;const seen=new Set(S.people.map(p=>(p.name+"|"+p.phones).toLowerCase()));
  for(const r of rows){const name=g(r,["ism","name","fio"]);if(!name){sk++;continue}const phones=g(r,["telefon","phone","tel"]).replace(/[,;]\s*/g,"\n"),id=(name+"|"+phones).toLowerCase();if(seen.has(id)){sk++;continue}seen.add(id);
   let cat=g(r,["kategor","toifa","guruh"]);cat=S.cats.find(c=>c.toLowerCase()===cat.toLowerCase())||S.cats[S.cats.length-1];
   let b=g(r,["tug","birth"]);const m=b.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);if(m)b=m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");if(!/^\d{4}-\d{2}-\d{2}$/.test(b))b="";
   S.people.push({id:crypto.randomUUID(),created:Date.now(),photo:"",media:[],name,cat,phones,bday:b,city:g(r,["shahar","manzil","city"]),job:g(r,["kasb","ish","job"]),where:g(r,["qayerda","where"]),social:g(r,["ijtimoiy","instagram","telegram"]),benefit:g(r,["foyda"]),note:g(r,["izoh","note"])});n++}
  await save();render();hideM();alert(n+" ta qo‘shildi, "+sk+" ta o‘tkazib yuborildi")}catch(x){alert("Faylni o‘qib bo‘lmadi")}};
